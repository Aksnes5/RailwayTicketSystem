<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body, #map { width: 100%; height: 100%; margin: 0; background: #eef7ff; }
    .leaflet-control-attribution { font-size: 10px; background: rgba(255,255,255,.86) !important; }
    /* Native title and summary cards sit above this WebView.  Reserve their space so
       neither Leaflet's zoom control nor the rail-alignment badge hides underneath. */
    .leaflet-bottom.leaflet-right { bottom: 124px; right: 8px; }
    .leaflet-control-zoom { margin: 0 !important; border: 1px solid rgba(79, 111, 142, .32) !important;
      border-radius: 14px !important; overflow: hidden; box-shadow: 0 4px 14px rgba(31, 104, 176, .15); }
    .rail-popup { color: #182230; font: 14px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    .rail-popup b { color: #267bcc; }
    #message { position: absolute; z-index: 1000; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 68%;
      padding: 14px 16px; border-radius: 16px; color: #344054; background: rgba(255,255,255,.94); text-align: center;
      font: 14px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; box-shadow: 0 4px 18px rgba(31,104,176,.14); }
    #align-status { position: absolute; z-index: 1000; right: 10px; bottom: 126px; padding: 4px 9px; border-radius: 11px;
      color: #5a6b7d; background: rgba(255,255,255,.82); font: 11px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    .live-train-icon { width: 34px !important; height: 34px !important; margin-left: -17px !important; margin-top: -17px !important; background: transparent !important; border: 0 !important; }
    .live-train-icon span { display: flex; width: 34px; height: 34px; align-items: center; justify-content: center; border: 3px solid #fff;
      border-radius: 50%; box-sizing: border-box; color: #fff; background: #0a8f69; box-shadow: 0 2px 10px rgba(8,122,92,.42); font-size: 15px; line-height: 1; }
  </style>
</head>
<body>
  <div id="map" aria-label="中国铁路线路地图"></div>
  <div id="message">正在载入铁路地图…</div>
  <div id="align-status" style="display:none"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Bundled OpenStreetMap rail alignment, generated by tools/build_railway_network.py.
       Loaded as a plain script rather than injected from Kotlin: a payload this size does
       not survive WebView.evaluateJavascript reliably, and the failure is silent. -->
  <script src="railway_network.js"></script>
  <script>
    let map;
    let routeLayer;
    let stationLayer;
    let liveTrainLayer;
    let standardLayer;
    let satelliteLayer;
    let activeBase = 'standard';
    let activePayload;
    const message = document.getElementById('message');
    const DAY_MILLIS = 24 * 60 * 60 * 1000;

    function initialize() {
      if (!window.L) {
        message.textContent = '地图服务暂不可用，请检查网络后重试';
        return;
      }
      // The native map screen already supplies its own controls and route status.
      // Do not leave Leaflet's default attribution plaque floating over the route.
      map = L.map('map', { zoomControl: false, attributionControl: false }).setView([35.86, 104.20], 4);
      L.control.zoom({ position: 'bottomright' }).addTo(map);
      standardLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, minZoom: 3, detectRetina: true, crossOrigin: true
      });
      satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19, maxNativeZoom: 19, minZoom: 3, detectRetina: true, crossOrigin: true
      });
      standardLayer.addTo(map);
      message.style.display = 'none';
    }

    window.switchMapBase = function(nextBase) {
      if (!map || !standardLayer || !satelliteLayer) return activeBase;
      const target = nextBase === 'satellite' ? 'satellite' : 'standard';
      if (target === activeBase) return activeBase;
      map.removeLayer(activeBase === 'satellite' ? satelliteLayer : standardLayer);
      (target === 'satellite' ? satelliteLayer : standardLayer).addTo(map);
      activeBase = target;
      return activeBase;
    };
    function markerStyle(station, payload) {
      if (station.name === payload.boardingStation) return { color: '#ffffff', fillColor: '#3b99fc', fillOpacity: 1, radius: 8, weight: 3 };
      if (station.name === payload.alightingStation) return { color: '#ffffff', fillColor: '#e64a19', fillOpacity: 1, radius: 8, weight: 3 };
      return { color: '#ffffff', fillColor: '#267bcc', fillOpacity: .98, radius: station.exactStation ? 6 : 5, weight: 2.5 };
    }

    function clearRoute() {
      if (routeLayer) map.removeLayer(routeLayer);
      if (stationLayer) map.removeLayer(stationLayer);
      if (liveTrainLayer) map.removeLayer(liveTrainLayer);
      liveTrainLayer = null;
      legPaths = [];
      alignedStationPoints = [];
      reportNativeLiveStatus('');
    }

    function chinaTimestamp(date, clock) {
      if (!date || !clock || clock === '—') return null;
      const dateParts = date.split('-').map(Number);
      const timeParts = clock.split(':').map(Number);
      if (dateParts.length !== 3 || timeParts.length !== 2 || dateParts.some(Number.isNaN) || timeParts.some(Number.isNaN)) return null;
      // Timetables are China Railway local time (UTC+8), independent of the phone's locale.
      return Date.UTC(dateParts[0], dateParts[1] - 1, dateParts[2], timeParts[0] - 8, timeParts[1]);
    }

    function normalizeAfter(timestamp, minimum) {
      if (!Number.isFinite(timestamp)) return minimum;
      while (timestamp < minimum) timestamp += DAY_MILLIS;
      return timestamp;
    }

    function normalizeBefore(timestamp, maximum) {
      if (!Number.isFinite(timestamp)) return maximum;
      while (timestamp > maximum) timestamp -= DAY_MILLIS;
      return timestamp;
    }

    function serviceTimeline(payload) {
      const rows = payload.timetableStops || [];
      if (rows.length < 2 || !payload.departureDate) return [];
      const boardIndex = Math.max(0, rows.findIndex(stop => stop.stationName === payload.boardingStation));
      const timeline = new Array(rows.length);
      const anchorRow = rows[boardIndex];
      let anchorDeparture = chinaTimestamp(payload.departureDate, anchorRow.departureTime);
      if (!Number.isFinite(anchorDeparture)) anchorDeparture = chinaTimestamp(payload.departureDate, anchorRow.arrivalTime);
      if (!Number.isFinite(anchorDeparture)) return [];
      let anchorArrival = chinaTimestamp(payload.departureDate, anchorRow.arrivalTime);
      if (!Number.isFinite(anchorArrival)) anchorArrival = anchorDeparture;
      timeline[boardIndex] = {
        name: anchorRow.stationName,
        arrival: normalizeBefore(anchorArrival, anchorDeparture),
        departure: anchorDeparture
      };
      // The selected boarding station fixes the service date. Earlier calls can
      // belong to the previous day, so walk backwards before walking forwards.
      for (let index = boardIndex - 1; index >= 0; index--) {
        const row = rows[index];
        const nextArrival = timeline[index + 1].arrival;
        let departure = chinaTimestamp(payload.departureDate, row.departureTime);
        if (!Number.isFinite(departure)) departure = chinaTimestamp(payload.departureDate, row.arrivalTime);
        departure = normalizeBefore(departure, nextArrival);
        let arrival = chinaTimestamp(payload.departureDate, row.arrivalTime);
        if (!Number.isFinite(arrival)) arrival = departure;
        timeline[index] = { name: row.stationName, arrival: normalizeBefore(arrival, departure), departure };
      }
      for (let index = boardIndex + 1; index < rows.length; index++) {
        const row = rows[index];
        const previousDeparture = timeline[index - 1].departure;
        let arrival = chinaTimestamp(payload.departureDate, row.arrivalTime);
        if (!Number.isFinite(arrival)) arrival = chinaTimestamp(payload.departureDate, row.departureTime);
        arrival = normalizeAfter(arrival, previousDeparture);
        let departure = chinaTimestamp(payload.departureDate, row.departureTime);
        if (!Number.isFinite(departure)) departure = arrival;
        timeline[index] = { name: row.stationName, arrival, departure: normalizeAfter(departure, arrival) };
      }
      return timeline.filter(stop => stop.name && Number.isFinite(stop.arrival) && Number.isFinite(stop.departure));
    }

    function routeIndexAfter(stations, name, from) {
      for (let index = Math.max(0, from); index < stations.length; index++) {
        if (stations[index].name === name) return index;
      }
      return -1;
    }

    function segmentLengthKm(a, b) {
      const latitudeMid = (a.latitude + b.latitude) * Math.PI / 360;
      const northSouth = (b.latitude - a.latitude) * 111.32;
      const eastWest = (b.longitude - a.longitude) * 111.32 * Math.cos(latitudeMid);
      return Math.hypot(northSouth, eastWest);
    }

    function directionDegrees(from, to) {
      const latitudeMid = (from.latitude + to.latitude) * Math.PI / 360;
      const eastWest = (to.longitude - from.longitude) * Math.cos(latitudeMid);
      const northSouth = to.latitude - from.latitude;
      return Math.atan2(eastWest, northSouth) * 180 / Math.PI;
    }

    // legPaths[i] is the drawn geometry between routeStations[i] and [i+1] — the real
    // alignment when it could be snapped, otherwise the straight hop.
    let legPaths = [];
    // Coordinates used by station markers after a route is aligned to the rail geometry.
    let alignedStationPoints = [];

    function pathLengthKm(path) {
      let total = 0;
      for (let i = 0; i < path.length - 1; i++) {
        total += segmentLengthKm(
          { latitude: path[i][0], longitude: path[i][1] },
          { latitude: path[i + 1][0], longitude: path[i + 1][1] }
        );
      }
      return total;
    }

    /** Walks a leg's own geometry, so the marker stays on the drawn line. */
    function pointAtFraction(path, fraction) {
      let total = 0;
      const legs = [];
      for (let i = 0; i < path.length - 1; i++) {
        const a = { latitude: path[i][0], longitude: path[i][1] };
        const b = { latitude: path[i + 1][0], longitude: path[i + 1][1] };
        const length = segmentLengthKm(a, b);
        legs.push({ a, b, length });
        total += length;
      }
      if (total <= 0) {
        const only = path[0];
        return { latitude: only[0], longitude: only[1], bearing: 0 };
      }
      let remaining = total * Math.max(0, Math.min(1, fraction));
      for (let i = 0; i < legs.length; i++) {
        const { a, b, length } = legs[i];
        if (remaining <= length || i === legs.length - 1) {
          const t = length > 0 ? remaining / length : 0;
          return {
            latitude: a.latitude + (b.latitude - a.latitude) * t,
            longitude: a.longitude + (b.longitude - a.longitude) * t,
            bearing: directionDegrees(a, b)
          };
        }
        remaining -= length;
      }
      return null;
    }

    // A time fraction is resolved against the accumulated length of the drawn geometry
    // between two calls, so the marker follows the rails rather than the chord.
    function positionOnRoute(stations, fromName, toName, timeFraction) {
      const start = routeIndexAfter(stations, fromName, 0);
      const end = routeIndexAfter(stations, toName, start + 1);
      if (start < 0 || end <= start) return null;
      const legs = [];
      let totalLength = 0;
      for (let index = start; index < end; index++) {
        const path = legPaths[index];
        if (!path || path.length < 2) return null;
        const length = pathLengthKm(path);
        legs.push({ path, length });
        totalLength += length;
      }
      if (totalLength <= 0) return null;
      let remaining = totalLength * Math.max(0, Math.min(1, timeFraction));
      for (let index = 0; index < legs.length; index++) {
        const leg = legs[index];
        if (remaining <= leg.length || index === legs.length - 1) {
          return pointAtFraction(leg.path, leg.length > 0 ? remaining / leg.length : 0);
        }
        remaining -= leg.length;
      }
      return null;
    }

    function stationPosition(stations, name, preferredFrom) {
      const index = routeIndexAfter(stations, name, preferredFrom || 0);
      if (index < 0) return null;
      const stationPoint = alignedStationPoints[index] || [stations[index].latitude, stations[index].longitude];
      const nextPoint = alignedStationPoints[index + 1] || alignedStationPoints[index - 1] || stationPoint;
      const station = { latitude: stationPoint[0], longitude: stationPoint[1] };
      const next = { latitude: nextPoint[0], longitude: nextPoint[1] };
      return { latitude: station.latitude, longitude: station.longitude, bearing: directionDegrees(station, next) };
    }

    function livePosition(payload, nowMillis) {
      const timeline = serviceTimeline(payload);
      const stations = (payload.routeStations || []).filter(s => Number.isFinite(s.latitude) && Number.isFinite(s.longitude));
      if (timeline.length < 2 || stations.length < 2) return null;
      const origin = timeline[0];
      const terminal = timeline[timeline.length - 1];
      if (nowMillis < origin.departure) {
        return { ...stationPosition(stations, origin.name), status: `计划待发 · ${origin.name}` };
      }
      if (nowMillis >= terminal.arrival) {
        return { ...stationPosition(stations, terminal.name), status: `已到达 · ${terminal.name}` };
      }
      for (let index = 0; index < timeline.length - 1; index++) {
        const current = timeline[index];
        const next = timeline[index + 1];
        if (nowMillis >= current.arrival && nowMillis < current.departure) {
          return { ...stationPosition(stations, current.name), status: `停靠中 · ${current.name}` };
        }
        if (nowMillis >= current.departure && nowMillis < next.arrival) {
          const elapsedFraction = (nowMillis - current.departure) / (next.arrival - current.departure);
          const position = positionOnRoute(stations, current.name, next.name, elapsedFraction);
          if (position) return { ...position, status: `运行中 · ${current.name} → ${next.name}` };
        }
      }
      // Reached only when a leg had no usable geometry.  Arrival is already handled above, so
      // the train is still running: never claim it is about to arrive at the terminal.
      return { ...stationPosition(stations, terminal.name), status: `运行中 · 前往 ${terminal.name}` };
    }

    function reportNativeLiveStatus(status) {
      // The compact native summary row owns the live label; the map itself stays clear.
      if (window.RailwayMapBridge && typeof window.RailwayMapBridge.updateLiveStatus === 'function') {
        window.RailwayMapBridge.updateLiveStatus(status || '');
      }
    }

    function renderLiveTrain(nowMillis) {
      if (!map || !activePayload) return;
      if (liveTrainLayer) map.removeLayer(liveTrainLayer);
      const position = livePosition(activePayload, nowMillis);
      if (!position || !Number.isFinite(position.latitude) || !Number.isFinite(position.longitude)) {
        reportNativeLiveStatus('');
        return;
      }
      liveTrainLayer = L.marker([position.latitude, position.longitude], {
        icon: L.divIcon({
          className: 'live-train-icon',
          html: `<span style="transform:rotate(${position.bearing || 0}deg)">▲</span>`,
          iconSize: [34, 34], iconAnchor: [17, 17]
        }),
        zIndexOffset: 1000,
        interactive: true
      }).addTo(map);
      liveTrainLayer.bindPopup(`<div class="rail-popup"><b>${activePayload.trainNumber || '本次列车'}</b><br>${position.status}</div>`);
      reportNativeLiveStatus(position.status);
    }

    // ---- Real-alignment snapping -------------------------------------------------
    // The bundled network holds the actual OpenStreetMap rail geometry for the lines
    // the app's corridors run on.  Each leg between two stations is replaced by the
    // piece of that line lying between them; a leg whose stations cannot be placed on
    // one shared chain keeps its straight line.
    const MAX_SNAP_KM = 12;
    const KM_PER_DEGREE = 111.32;
    const NODE_KEY_DP = 5;
    const MIN_COMPONENT_NODES = 24;
    const MAX_DETOUR_RATIO = 1.6; // a snapped leg longer than this × the direct line is a detour
    // Exact station pins in the bundled 2024 OSM extract can be offset by a
    // station throat or a city approach.  Consider all viable corridor choices
    // out to 12 km, then let a same-corridor route choose the valid pair.
    const ANCHOR_RADII = [12];
    const MERGE_KM = 0.2;        // join mapped ways whose vertices do not quite coincide
    const GRID_DEG = 0.004;      // spatial hash cell for the merge scan (~440 m)

    let networkChains = null;
    let networkNodes = null;          // node id -> [longitude, latitude]
    let networkEdges = null;          // node id -> [neighbour node ids]
    let networkComponent = null;      // node id -> component id
    let networkComponentSize = null;  // component id -> node count
    let networkNodeLine = null;       // node id -> original OSM railway name

    function nodeKey(longitude, latitude) {
      return longitude.toFixed(NODE_KEY_DP) + ',' + latitude.toFixed(NODE_KEY_DP);
    }

    /**
     * Flattens the chains into a routed graph.  The bundle stores chains, and a chain can
     * end where another begins, so vertices are deduplicated by rounded coordinate — that
     * rejoins the pieces without depending on how well they were merged offline.
     */
    function networkReady() {
      if (networkNodes) return true;
      return buildNetworkGraph();
    }

    function buildNetworkGraph() {
      const net = window.railwayNetwork;
      if (!net || !net.features) return false;
      networkChains = net.features
        .map(f => ({
          points: f.geometry && f.geometry.coordinates,
          // A corridor may contain several raw OSM names (for example a main
          // line plus its city approaches).  It is the safe routing boundary;
          // falling back to the raw name keeps an old asset readable.
          line: (f.properties && (f.properties.corridor || f.properties.name)) || ''
        }))
        .filter(chain => chain.points && chain.points.length >= 2);
      const lookup = new Map();
      const grid = new Map();
      networkNodes = [];
      networkEdges = [];
      networkNodeLine = [];
      const cellKey = (point) => (point[0] / GRID_DEG).toFixed(0) + ',' + (point[1] / GRID_DEG).toFixed(0);
      const idOf = (point, line) => {
        // Never coalesce two differently named railways merely because they
        // run within a few metres in a station throat.  That was creating
        // fictional interchanges and Dijkstra subsequently took a detour onto
        // an unrelated corridor.
        const exact = line + '|' + nodeKey(point[0], point[1]);
        let id = lookup.get(exact);
        if (id !== undefined) return id;
        // Vertices do not always coincide where two mapped ways meet (station throats,
        // up/down tracks, chain seams), which would leave the graph split into hundreds of
        // components.  Reuse any node within MERGE_KM so those pieces join up.  At the
        // zooms this map uses the sub-200 m difference is not visible.
        const cx = Math.floor(point[0] / GRID_DEG);
        const cy = Math.floor(point[1] / GRID_DEG);
        for (let dx = -1; dx <= 1 && id === undefined; dx++) {
          for (let dy = -1; dy <= 1 && id === undefined; dy++) {
            for (const candidate of grid.get(line + '|' + (cx + dx) + ',' + (cy + dy)) ?? []) {
              const cosLat = Math.cos(point[1] * Math.PI / 180);
              const east = (networkNodes[candidate][0] - point[0]) * KM_PER_DEGREE * cosLat;
              const north = (networkNodes[candidate][1] - point[1]) * KM_PER_DEGREE;
              if (Math.hypot(east, north) <= MERGE_KM) { id = candidate; break; }
            }
          }
        }
        if (id === undefined) {
          id = networkNodes.length;
          networkNodes.push(point);
          networkEdges.push([]);
          networkNodeLine.push(line);
          const key = line + '|' + cellKey(point);
          if (!grid.has(key)) grid.set(key, []);
          grid.get(key).push(id);
        }
        lookup.set(exact, id);
        return id;
      };
      for (const chain of networkChains) {
        let previous = idOf(chain.points[0], chain.line);
        for (let i = 1; i < chain.points.length; i++) {
          const current = idOf(chain.points[i], chain.line);
          if (current !== previous) {
            networkEdges[previous].push(current);
            networkEdges[current].push(previous);
          }
          previous = current;
        }
      }
      if (networkNodes.length > 0) labelComponents();
      return networkNodes.length > 0;
    }

    /**
     * Labels connected components and their sizes.  Station throats are mapped as their own
     * little ways (platform roads, crossovers) that do not share vertices with the running
     * line, so the vertex-nearest node to a station often sits on an isolated scrap of a few
     * dozen nodes.  Routing from there dead-ends, so snapping prefers a real component.
     */
    function labelComponents() {
      const size = new Int32Array(networkNodes.length).fill(-1);
      const componentSize = [];
      for (let start = 0; start < networkNodes.length; start++) {
        if (size[start] !== -1) continue;
        const id = componentSize.length;
        const queue = [start];
        size[start] = id;
        let count = 0;
        for (let head = 0; head < queue.length; head++) {
          const current = queue[head];
          count++;
          for (const neighbour of networkEdges[current]) {
            if (size[neighbour] === -1) {
              size[neighbour] = id;
              queue.push(neighbour);
            }
          }
        }
        componentSize.push(count);
      }
      networkComponent = size;
      networkComponentSize = componentSize;
    }

    /**
     * Candidate rail nodes grouped by their original OSM railway name.  A
     * station can be close to several parallel railways; retaining a few
     * choices lets a consecutive pair select the one that actually joins it.
     */
    function networkAllowsLine(line, network) {
      const highSpeed = /(高铁|高速|客专|城际|动车|武九客专|宁蓉铁路|昌福铁路|秦沈客专|厦深铁路)/.test(line || '');
      return network === 'CONVENTIONAL' ? !highSpeed : highSpeed;
    }

    function nearestNodesByLine(latitude, longitude, maxKm, network) {
      const limit = maxKm || MAX_SNAP_KM;
      const cosLat = Math.cos(latitude * Math.PI / 180);
      const bestByLine = new Map();
      for (let n = 0; n < networkNodes.length; n++) {
        const dx = (networkNodes[n][0] - longitude) * KM_PER_DEGREE * cosLat;
        const dy = (networkNodes[n][1] - latitude) * KM_PER_DEGREE;
        const km = Math.hypot(dx, dy);
        if (km > limit || networkComponentSize[networkComponent[n]] < MIN_COMPONENT_NODES) continue;
        const line = networkNodeLine[n];
        if (!networkAllowsLine(line, network)) continue;
        const existing = bestByLine.get(line);
        if (!existing || km < existing.km) bestByLine.set(line, { id: n, km, line });
      }
      return [...bestByLine.values()].sort((a, b) => a.km - b.km).slice(0, 5);
    }

    // `railway_network.js` includes exact OSM station pins from the same source
    // as its rail alignments.  They override a Kotlin city fallback (for example
    // 汉川市区) before any snap or marker calculation happens.
    function withNetworkStationPoints(stations) {
      const points = window.railwayStationPoints || {};
      return stations.map(station => {
        const point = points[station.name];
        if (!point || !Number.isFinite(point[0]) || !Number.isFinite(point[1])) return station;
        return { ...station, longitude: point[0], latitude: point[1], exactStation: true, estimated: false };
      });
    }

    function nodeDistanceKm(a, b) {
      const cosLat = Math.cos(networkNodes[a][1] * Math.PI / 180);
      const dx = (networkNodes[b][0] - networkNodes[a][0]) * KM_PER_DEGREE * cosLat;
      const dy = (networkNodes[b][1] - networkNodes[a][1]) * KM_PER_DEGREE;
      return Math.hypot(dx, dy);
    }

    /**
     * Dijkstra by distance, not by hop count.  Hop count would be cheaper, but it prefers
     * whatever path has the fewest edges — which in a merged rail graph means a detour along
     * another line, not the direct one.  A binary heap keeps it fast enough per leg.
     */
    function routeBetween(startId, goalId) {
      if (startId === goalId) return null;
      const distance = new Map([[startId, 0]]);
      const cameFrom = new Map([[startId, -1]]);
      const heap = [[0, startId]];
      const push = (entry) => {
        heap.push(entry);
        let i = heap.length - 1;
        while (i > 0) {
          const parent = (i - 1) >> 1;
          if (heap[parent][0] <= heap[i][0]) break;
          [heap[parent], heap[i]] = [heap[i], heap[parent]];
          i = parent;
        }
      };
      const pop = () => {
        const top = heap[0];
        const last = heap.pop();
        if (heap.length) {
          heap[0] = last;
          let i = 0;
          for (;;) {
            const left = 2 * i + 1, right = left + 1;
            let smallest = i;
            if (left < heap.length && heap[left][0] < heap[smallest][0]) smallest = left;
            if (right < heap.length && heap[right][0] < heap[smallest][0]) smallest = right;
            if (smallest === i) break;
            [heap[smallest], heap[i]] = [heap[i], heap[smallest]];
            i = smallest;
          }
        }
        return top;
      };
      while (heap.length > 0) {
        const [travelled, current] = pop();
        if (travelled > (distance.get(current) ?? Infinity)) continue;
        if (current === goalId) {
          const path = [];
          let walk = current;
          while (walk !== -1) {
            path.push([networkNodes[walk][1], networkNodes[walk][0]]);
            walk = cameFrom.get(walk);
          }
          return path.reverse();
        }
        for (const neighbour of networkEdges[current]) {
          const candidate = travelled + nodeDistanceKm(current, neighbour);
          if (candidate < (distance.get(neighbour) ?? Infinity)) {
            distance.set(neighbour, candidate);
            cameFrom.set(neighbour, current);
            push([candidate, neighbour]);
          }
        }
      }
      return null;
    }


    /** Position along a path, in km from its start, of the point nearest to a station. */
    function projectOnPath(path, latitude, longitude) {
      const cosLat = Math.cos(latitude * Math.PI / 180);
      let travelled = 0;
      let best = { at: 0, km: Infinity, point: [path[0][0], path[0][1]] };
      for (let i = 0; i < path.length - 1; i++) {
        const aLat = path[i][0], aLng = path[i][1];
        const bLat = path[i + 1][0], bLng = path[i + 1][1];
        const dx = (bLng - aLng) * cosLat, dy = bLat - aLat;
        const span = Math.hypot(dx, dy);
        const px = (longitude - aLng) * cosLat, py = latitude - aLat;
        let t = span > 0 ? (px * dx + py * dy) / (span * span) : 0;
        t = Math.max(0, Math.min(1, t));
        const projLat = aLat + (bLat - aLat) * t;
        const projLng = aLng + (bLng - aLng) * t;
        const off = Math.hypot((longitude - projLng) * cosLat, latitude - projLat) * KM_PER_DEGREE;
        if (off < best.km) {
          best = { at: travelled + span * KM_PER_DEGREE * t, km: off, point: [projLat, projLng] };
        }
        travelled += span * KM_PER_DEGREE;
      }
      return best;
    }

    /** The stretch of a path between two kilometre marks, as a polyline. */
    function slicePath(path, firstKm, secondKm) {
      const low = Math.min(firstKm, secondKm), high = Math.max(firstKm, secondKm);
      const points = [];
      let travelled = 0;
      for (let i = 0; i < path.length - 1; i++) {
        const a = path[i], b = path[i + 1];
        const span = segmentLengthKm(
          { latitude: a[0], longitude: a[1] }, { latitude: b[0], longitude: b[1] });
        const start = travelled, end = travelled + span;
        if (end >= low && start <= high) {
          const t0 = span > 0 ? Math.max(0, (low - start) / span) : 0;
          const t1 = span > 0 ? Math.min(1, (high - start) / span) : 1;
          if (points.length === 0) {
            points.push([a[0] + (b[0] - a[0]) * t0, a[1] + (b[1] - a[1]) * t0]);
          }
          points.push([a[0] + (b[0] - a[0]) * t1, a[1] + (b[1] - a[1]) * t1]);
        }
        travelled = end;
      }
      return points.length >= 2 ? points : null;
    }

    function straightRoute(stations) {
      legPaths = [];
      alignedStationPoints = stations.map(station => [station.latitude, station.longitude]);
      const path = [];
      for (let i = 0; i < stations.length - 1; i++) {
        const leg = [[stations[i].latitude, stations[i].longitude],
                     [stations[i + 1].latitude, stations[i + 1].longitude]];
        legPaths.push(leg);
        if (i === 0) path.push(leg[0]);
        path.push(leg[1]);
      }
      return { path, snapped: 0, legs: stations.length - 1, routed: false };
    }

    /**
     * Finds a rail-only path for two true station anchors.  Candidate pairs must
     * share an OSM railway name; unlike the former national super-graph, this
     * cannot quietly jump from a parallel line to an unrelated corridor.
     */
    function pathForAnchorPair(fromStation, toStation, fromCandidates, toCandidates, corridorHints) {
      const direct = segmentLengthKm(fromStation, toStation);
      if (direct <= 0) return null;
      // Kotlin supplies a physical-corridor hint for shared/continued lines.
      // The hint is intentionally optional: imported routes that do not need
      // alias resolution retain the conservative same-corridor behaviour.
      const allowedCorridors = new Set((corridorHints || []).filter(hint => hint && hint !== "__manual_physical_alignment__"));
      if ((corridorHints || []).includes("__manual_physical_alignment__")) return null;
      let best = null;
      for (const from of fromCandidates) {
        for (const to of toCandidates) {
          if (allowedCorridors.size > 0) {
            if (!allowedCorridors.has(from.line) || !allowedCorridors.has(to.line)) continue;
          } else if (from.line !== to.line) {
            continue;
          }
          const path = routeBetween(from.id, to.id);
          if (!path || path.length < 2) continue;
          const length = pathLengthKm(path);
          if (length > direct * MAX_DETOUR_RATIO) continue;
          const score = length / direct + (from.km + to.km) / Math.max(direct, 1);
          if (!best || score < best.score) best = { path, length, score };
        }
      }
      return best;
    }

    /**
     * Snaps only reliable station anchors to the rails.
     *
     * City fallback and interpolated coordinates are deliberately not anchors:
     * snapping a city centre to its nearest rail was the main reason a train
     * line jumped to an unrelated corridor.  The real path between two known
     * anchors is distributed across the intermediate physical station legs, so
     * it remains continuous even when only a few stations have exact positions.
     */
    function buildRoutePath(stations, legCorridorHints) {
      if (stations.length < 2) return straightRoute(stations);
      if (!networkReady()) return straightRoute(stations);

      const fallback = straightRoute(stations);
      let candidates = [];
      let anchors = [];
      for (const radius of ANCHOR_RADII) {
        candidates = stations.map(station =>
          station.exactStation && !station.estimated
            ? nearestNodesByLine(station.latitude, station.longitude, radius, activePayload && activePayload.network)
            : []);
        anchors = candidates.map((choices, index) => choices.length ? index : -1).filter(index => index >= 0);
        if (anchors.length >= 2) break;
      }
      if (anchors.length < 2) return fallback;

      let snapped = 0;
      for (let a = 0; a < anchors.length - 1; a++) {
        const from = anchors[a];
        const to = anchors[a + 1];
        // One routed anchor pair can cover several non-call stations. Only
        // pin it to a corridor when every leg belongs to the same physical
        // alignment; a genuine junction remains two independently routed legs.
        const spanHints = (legCorridorHints || []).slice(from, to).filter(Boolean);
        const sharedHint = spanHints.length > 0 && spanHints.every(hint => hint === spanHints[0])
          ? [spanHints[0]] : [];
        const matched = pathForAnchorPair(
          stations[from], stations[to], candidates[from], candidates[to], sharedHint);
        if (!matched) continue;
        for (let index = from; index < to; index++) {
          const firstFraction = (index - from) / (to - from);
          const secondFraction = (index + 1 - from) / (to - from);
          const leg = slicePath(matched.path, matched.length * firstFraction, matched.length * secondFraction);
          if (!leg) continue;
          legPaths[index] = leg;
          alignedStationPoints[index] = leg[0];
          alignedStationPoints[index + 1] = leg[leg.length - 1];
          snapped++;
        }
      }
      const path = [];
      legPaths.forEach((leg, i) => {
        if (i === 0) path.push(leg[0]);
        for (let k = 1; k < leg.length; k++) path.push(leg[k]);
      });
      return { path, snapped, legs: stations.length - 1, routed: snapped > 0 };
    }

    /** Small on-map badge: makes a failed bundle load obvious instead of silently straight. */
    function reportAlignment(aligned) {
      const badge = document.getElementById('align-status');
      if (!badge) return;
      if (!window.railwayNetwork) {
        badge.textContent = '轨道数据未加载';
      } else if (!aligned.routed) {
        badge.textContent = '轨道数据已加载 · 本站无法定位';
      } else {
        badge.textContent = '已贴合真实走向 ' + aligned.snapped + '/' + aligned.legs + ' 段';
      }
      badge.style.display = 'block';
    }

    window.renderRailwayRoute = function(payload) {
      if (!map) initialize();
      if (!map) return;
      clearRoute();
      const routeStations = withNetworkStationPoints(payload.routeStations || [])
        .filter(s => Number.isFinite(s.latitude) && Number.isFinite(s.longitude));
      if (routeStations.length < 2) {
        message.textContent = '暂未收录该线路足够的站点坐标';
        message.style.display = 'block';
        return;
      }
      message.style.display = 'none';
      activePayload = { ...payload, routeStations };
      // snapLeg() returns null when the bundle is missing or a leg cannot be placed, so
      // this single call covers both the aligned and the straight-line case.
      networkReady();
      const aligned = buildRoutePath(routeStations, payload.routeCorridorHints || []);
      reportAlignment(aligned);
      routeLayer = L.polyline(aligned.path, { color: '#247dcc', weight: 5, opacity: .92, lineJoin: 'round', lineCap: 'round', smoothFactor: 1 }).addTo(map);
      stationLayer = L.layerGroup().addTo(map);
      const callingStations = new Set(payload.callingStations || []);
      routeStations.forEach((station, index) => {
        if (!callingStations.has(station.name)) return;
        const markerPoint = alignedStationPoints[index] || [station.latitude, station.longitude];
        const marker = L.circleMarker(markerPoint, markerStyle(station, payload));
        const label = station.name === payload.boardingStation ? '上车站' : station.name === payload.alightingStation ? '到达站' : '经停站';
        const accuracy = station.exactStation ? '车站坐标' : station.estimated ? '估算位置' : '城市范围坐标';
        marker.bindPopup(`<div class="rail-popup"><b>${station.name}</b><br>${label} · ${accuracy}</div>`);
        marker.addTo(stationLayer);
      });
      const bounds = routeLayer.getBounds();
      // Fit to the visible map area: native cards cover the top and bottom of the WebView.
      if (bounds.isValid()) map.fitBounds(bounds, { paddingTopLeft: [42, 154], paddingBottomRight: [42, 150], maxZoom: 7 });
      renderLiveTrain(Date.now());
    };

    window.updateTrainPosition = function(nowMillis) {
      renderLiveTrain(Number(nowMillis) || Date.now());
    };

    initialize();
  </script>
</body>
