plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.railway.ticketsystem'
    compileSdk 34

    defaultConfig {
        applicationId "com.railway.ticketsystem"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
    testOptions {
        unitTests.returnDefaultValues = true   // 生成器里有 android.util.Log，JVM 测试直接当空操作
        unitTests.all { it.maxHeapSize = "2g" }  // 中转基准要在同一个 JVM 里跑好几对站
    }
}

// 性能基准的结论写在 println 里，跑的时候要能看见。
tasks.withType(Test).configureEach {
    testLogging { showStandardStreams = true }
}

// 将生成的 APK 复制并重命名到项目根目录，便于统一获取
tasks.register('copyDebugApk') {
    mustRunAfter('assembleDebug')
    doLast {
        def srcApk = file("${project.buildDir}/outputs/apk/debug/app-debug.apk")
        if (srcApk.exists()) {
            copy {
                from srcApk
                into rootDir
                rename { '12306-debug.apk' }
            }
        }
    }
}

afterEvaluate {
    def t = tasks.findByName('assembleDebug')
    if (t != null) {
        t.finalizedBy 'copyDebugApk'
    }
}

tasks.register('copyReleaseApk') {
    mustRunAfter('assembleRelease')
    doLast {
        def srcApk = file("${project.buildDir}/outputs/apk/release/app-release.apk")
        if (srcApk.exists()) {
            copy {
                from srcApk
                into rootDir
                rename { '12306-release.apk' }
            }
        }
    }
}

afterEvaluate {
    def tRel = tasks.findByName('assembleRelease')
    if (tRel != null) {
        tRel.finalizedBy 'copyReleaseApk'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.5'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.5'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.1'
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
// One reproducible entry point for local checks and CI.  Keep tests and packaging together so
// a green APK artifact always corresponds to the source and behavior that were validated.
tasks.register('verifyReleaseBaseline') {
    group = 'verification'
    description = 'Runs unit tests and packages the debug APK used for release verification.'
    dependsOn 'testDebugUnitTest', 'assembleDebug'
}